<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab · o-dimarxos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../theme.css?v=__BUILD__">
<link rel="stylesheet" href="../style.css?v=__BUILD__">
<link rel="stylesheet" href="lab.css?v=__BUILD__">
<script>
  // εμφάνιση πριν από το πρώτο σχεδίασμα (χωρίς «αναλαμπή»): lab (προεπιλογή) ή generic
  (function () { let m = "lab"; try { m = localStorage.getItem("lab_mode") || "lab"; } catch (e) { /* χωρίς αποθήκευση */ }
    document.documentElement.dataset.mode = m; })();
</script>
</head>
<body>
<script>document.body.className = document.documentElement.dataset.mode === "generic" ? "generic" : "lab";</script>
<header class="wrap lab-top">
  <h1 class="glitch"><span class="prompt">root@o-dimarxos:~/</span>lab<span class="prompt">$</span></h1>
  <span class="grow"></span>
  <div class="mode-seg" role="group" aria-label="Εμφάνιση">
    <button data-mode="lab">LAB</button><button data-mode="generic">GENERIC</button>
  </div>
  <a href="../index.html">← σάιτ</a>
</header>

<main class="wrap lab-main">
  <section class="hero">
    <div class="portal-wrap"><div class="portal" aria-hidden="true"></div></div>
    <div class="panel"><pre class="boot" id="boot" aria-live="polite"></pre></div>
  </section>
  <div id="exps"><div class="empty">Φόρτωση…</div></div>
  <section class="panel" id="method"></section>
</main>
<footer class="wrap">προσωπικό εργαστήριο · πειράματα, όχι παραγωγή · τα αποτελέσματα ξαναβγαίνουν με <code>python scripts/lab_autoencoder.py</code></footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pc = (v, d = 0) => (100 * v).toFixed(d) + "%";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------------- εμφάνιση ----------------
function setMode(m) {
  document.body.className = m; document.documentElement.dataset.mode = m;
  try { localStorage.setItem("lab_mode", m); } catch (e) { /* χωρίς αποθήκευση */ }
  document.querySelectorAll(".mode-seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
}
document.querySelectorAll(".mode-seg button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
setMode(document.body.className || "lab");

// ---------------- boot log ----------------
async function boot(lines) {
  const el = $("#boot");
  if (reduced || document.body.className === "generic") { el.innerHTML = lines.join("\n"); return; }
  el.innerHTML = "";
  for (const ln of lines) {
    const plain = ln.replace(/<[^>]+>/g, "");
    const span = document.createElement("span"); el.appendChild(span);
    for (let i = 1; i <= plain.length; i += 3) { span.textContent = plain.slice(0, i); await new Promise((r) => setTimeout(r, 8)); }
    span.innerHTML = ln; el.appendChild(document.createTextNode("\n"));
  }
  el.insertAdjacentHTML("beforeend", `<span class="cursor"></span>`);
}

// ---------------- διάγραμμα: ποσοστό που ξαναφτιάχνεται ως προς k ----------------
function curve(d) {
  const W = 560, H = 300, L = 46, R = 14, T = 14, B = 38, K = d.k.length;
  const X = (k) => L + ((k - 1) / (K - 1)) * (W - L - R), Y = (v) => H - B - v * (H - T - B);
  const path = (a) => a.map((v, i) => `${i ? "L" : "M"}${X(i + 1).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const up = d.ae.map((v, i) => Math.min(1, v + d.ae_sd[i])), lo = d.ae.map((v, i) => Math.max(0, v - d.ae_sd[i]));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ποσοστό που ξαναφτιάχνεται ανά αριθμό κρυφών μεταβλητών">`;
  for (const v of [0, 0.25, 0.5, 0.75, 1]) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${pc(v)}</text>`;
  for (const k of d.k) s += `<text x="${X(k)}" y="${H - B + 16}" text-anchor="middle">${k}</text>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">κρυφές μεταβλητές (κόμβοι στη στένωση) k</text>`;
  s += `<path class="band-ae" d="${path(up)} ${lo.map((v, i) => `L${X(K - i).toFixed(1)},${Y(lo[K - 1 - i]).toFixed(1)}`).join(" ")} Z"/>`;
  s += `<path class="s-pca" d="${path(d.pca)}"/><path class="s-ae" d="${path(d.ae)}"/>`;
  d.ae.forEach((v, i) => (s += `<circle class="d-ae" cx="${X(i + 1)}" cy="${Y(v)}" r="3.2"><title>k=${i + 1}: autoencoder ${pc(v, 1)} · PCA ${pc(d.pca[i], 1)}</title></circle>`));
  s += `<line class="mark" x1="${X(d.elbow)}" x2="${X(d.elbow)}" y1="${T}" y2="${H - B}"/><text x="${X(d.elbow) + 5}" y="${T + 12}" style="fill:var(--bad)">αγκώνας k=${d.elbow}</text>`;
  if (d.twonn <= K) s += `<line class="gl" x1="${X(d.twonn)}" x2="${X(d.twonn)}" y1="${T + 18}" y2="${H - B}" stroke-dasharray="2 4"/><text x="${X(d.twonn) + 5}" y="${T + 28}">TwoNN ${d.twonn.toFixed(1)}</text>`;
  return s + "</svg>";
}

function probes(list, title) {
  return `<div class="probes">${list.map((node, j) => `<div class="tile probe"><h4>${title} ${j + 1}</h4>
    ${node.map(([f, c]) => `<div class="fbar"><span>${esc(f)}</span><span class="b"><i class="${c >= 0 ? "pos" : "neg"}" style="left:${c >= 0 ? 50 : 50 + 50 * c}%;width:${Math.abs(50 * c)}%"></i></span><span style="text-align:right">${c > 0 ? "+" : ""}${c.toFixed(2)}</span></div>`).join("")}
  </div>`).join("")}</div>`;
}

function experiment(d, i) {
  const e = d.elbow - 1, gain = Math.max(...d.ae.map((v, k) => v - d.pca[k]));
  const kpca = d.pca.findIndex((v) => v >= d.ae[e]) + 1;
  const linear = gain < 0.02;
  const verdict = linear
    ? `Ο autoencoder δεν κερδίζει ουσιαστικά τίποτα από το PCA (το πολύ +${pc(gain, 1)}). Η δομή των δεδομένων είναι <b>γραμμική</b>: αρκούν γραμμικοί συνδυασμοί των μεγεθών.`
    : `Ο autoencoder ξαναφτιάχνει περισσότερα από το PCA με τις ίδιες κρυφές μεταβλητές (έως +${pc(gain, 1)}): υπάρχει <b>μη γραμμική δομή</b>.${kpca > d.elbow ? ` Με k=${d.elbow} κάνει όσα το PCA με ${kpca}.` : ""}`;
  return `<section class="exp" style="margin-bottom:26px">
    <div class="exp-head"><span class="id">EXP-001${"AB"[i]}</span><h2 style="margin:0">${esc(d.title)}</h2></div>
    <p class="sub" style="margin:0">${d.n.toLocaleString("el-GR")} εγγραφές × ${d.n_feats} μεγέθη (${esc(d.feats.join(", "))}), σε τυπικές αποκλίσεις μέσα σε κάθε λίγκα-σεζόν.</p>
    <div class="exp-grid">
      <div class="panel lab-chart">${curve(d)}
        <div class="legend2"><span><i style="background:var(--c1)"></i>autoencoder (μέσος ± τυπική απόκλιση)</span><span><i style="background:var(--c2)"></i>PCA (γραμμικό)</span><span><i style="background:var(--bad)"></i>αγκώνας</span></div></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="readout">
          <div class="tile alert"><div class="v">${d.elbow}</div><div class="l">κρυφές μεταβλητές για το 90% του μέγιστου</div></div>
          <div class="tile"><div class="v">${pc(d.ae[e])}</div><div class="l">ξαναφτιάχνεται με k=${d.elbow} (PCA ${pc(d.pca[e])})</div></div>
          <div class="tile"><div class="v">${d.twonn.toFixed(1)}</div><div class="l">εγγενής διάσταση (TwoNN)</div></div>
          <div class="tile"><div class="v">${gain >= 0 ? "+" : ""}${pc(gain, 1)}</div><div class="l">μέγιστο κέρδος autoencoder έναντι PCA</div></div>
        </div>
        <p class="verdict">${verdict}</p>
        <p class="sub" style="margin:0">Με 1 κρυφή μεταβλητή: ${pc(d.ae[0])}· με 3: ${pc(d.ae[2])}· με ${d.k.length}: ${pc(d.ae.at(-1))}.</p>
      </div>
    </div>
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">Τι «μετράει» κάθε κρυφή μεταβλητή (k=${d.elbow})</h3>
      <div class="tabs2"><button class="chip on" data-t="ae" data-x="${i}">autoencoder</button><button class="chip" data-t="pca" data-x="${i}">PCA</button></div></div>
    <p class="sub" style="margin:0">Συσχέτιση κάθε κόμβου της στένωσης (ή φόρτιση κάθε συνιστώσας του PCA) με τα 4 μεγέθη που επηρεάζει περισσότερο. Οι κόμβοι δεν έχουν σταθερό όνομα: σε άλλη εκπαίδευση μπορεί να βγουν περιστραμμένοι.</p>
    <div id="pr${i}">${probes(d.nodes, "κόμβος")}</div>
  </section>`;
}

async function main() {
  const D = await fetch("ae.json?v=__BUILD__").then((r) => r.json());
  const [A, P] = D.datasets;
  boot([
    `> ./mount data/raw --leagues EL,EC,GBL,NBA ......... <span class="ok">[ok]</span>`,
    `> ./exp-001 autoencoder n→${D.hidden}→k→${D.hidden}→n, k=1..${A.k.length}`,
    `  folds: ${D.folds} (ανά σεζόν) · seeds: ${D.seeds} · μέτρο: R² εκτός εκπαίδευσης`,
    `> A. αγώνες   ${A.n} × ${A.n_feats}  -> αγκώνας k=${A.elbow}, TwoNN ${A.twonn.toFixed(1)}`,
    `> B. παίκτες  ${P.n} × ${P.n_feats}  -> αγκώνας k=${P.elbow}, TwoNN ${P.twonn.toFixed(1)}`,
    `> σύγκριση με PCA ................................. <span class="ok">[done]</span>`,
    `> status: <span class="warn">ΠΕΙΡΑΜΑΤΙΚΟ</span> · καλώς ήρθες στο εργαστήριο.`,
  ]);
  $("#exps").innerHTML = D.datasets.map(experiment).join("");
  $("#exps").addEventListener("click", (e) => {
    const b = e.target.closest("[data-t]"); if (!b) return;
    const d = D.datasets[+b.dataset.x];
    $("#pr" + b.dataset.x).innerHTML = b.dataset.t === "ae" ? probes(d.nodes, "κόμβος") : probes(d.pcs, "συνιστώσα");
    b.parentElement.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === b));
  });
  $("#method").innerHTML = `<h3 style="margin-top:0">Μέθοδος</h3>
    <p style="margin:0 0 8px;max-width:85ch">Ένας <b>autoencoder</b> μαθαίνει να συμπιέζει κάθε εγγραφή σε k αριθμούς (τη «στένωση») και να την ξαναφτιάχνει. Αν με k αριθμούς ξαναφτιάχνει σχεδόν όλη την πληροφορία, τα δεδομένα «ζουν» σε περίπου k διαστάσεις. Το <b>PCA</b> κάνει το ίδιο με γραμμικούς συνδυασμούς· η διαφορά τους δείχνει αν υπάρχει μη γραμμική δομή.</p>
    <ul style="margin:0;max-width:85ch">
      <li>Δίκτυο n → ${D.hidden} → k → ${D.hidden} → n, ενεργοποίηση tanh, μικρή ποινή L2, early stopping.</li>
      <li>Μέτρο: ποσοστό της διασποράς που ξαναφτιάχνεται (R²) σε λίγκες-σεζόν που <i>δεν</i> είδε η εκπαίδευση (${D.folds} folds), μέσος όρος ${D.seeds} αρχικοποιήσεων.</li>
      <li>Αγκώνας: το μικρότερο k που φτάνει το 90% του καλύτερου αποτελέσματος.</li>
      <li>TwoNN: εκτίμηση της εγγενούς διάστασης από τις αποστάσεις κάθε σημείου στους 2 πλησιέστερους γείτονες, χωρίς εκπαίδευση.</li>
    </ul>`;
}
main().catch((e) => { $("#exps").innerHTML = `<div class="empty">Σφάλμα: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
