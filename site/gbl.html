<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GBL · Προγνωστικά</title>
<link rel="stylesheet" href="theme.css?v=__BUILD__">
<link rel="stylesheet" href="style.css?v=__BUILD__">
<style>
  /* μόνο διάταξη (χρώματα/τυπογραφία από το theme.css) */
  main.lite { display: flex; flex-direction: column; gap: 30px; padding-block: 18px 40px; }
  .lite section { display: flex; flex-direction: column; gap: 10px; }
  .lite h2 { margin: 0; }
  .lite .sub { margin: 0; color: var(--muted); font-size: 13px; max-width: 75ch; }
  .lite .more { font-size: 13px; }
  .scat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
  .scat-grid figure { margin: 0; }
  .scat-grid figcaption { font-weight: 600; margin: 0 0 4px; }
  .scat-grid figcaption small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .chart g[data-team] { cursor: pointer; }
  .pl-row { cursor: pointer; }
  .pl-row.on { background: var(--accent-soft); }
  .pcard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
  @media (max-width: 720px) { .pcard { grid-template-columns: 1fr; } }
  .pfacts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0; font-size: 14px; }
  .pfacts dt { color: var(--muted); }
  .pfacts dd { margin: 0; }
  .fixt { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; }
  .fixt .tile { display: flex; flex-direction: column; gap: 4px; }
  .pbar2 { display: inline-block; width: 80px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; overflow: hidden; }
  .pbar2 i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand-row"><div class="brand"><h1>Stoiximan GBL</h1><small id="upd">τα βασικά, με μια ματιά</small></div></div>
    <nav class="tabs">
      <a href="#standings">Βαθμολογία</a>
      <a href="#next">Επόμενη αγωνιστική</a>
      <a href="#teams">Ομάδες</a>
      <a href="#players">Παίκτες</a>
      <a href="index.html">Πλήρες σάιτ →</a>
    </nav>
  </div>
</header>
<main class="wrap lite">
  <section id="standings"><h2>Βαθμολογία</h2><div class="empty">Φόρτωση…</div></section>
  <section id="next"></section>
  <section id="teams"></section>
  <section id="players"></section>
</main>
<footer class="wrap">Μινιμαλιστική εκδοχή για την ελληνική λίγκα. Για αναλυτικά (shot charts, ratings, σύγκριση παικτών, μοντέλα) δες το <a href="index.html">πλήρες σάιτ</a>.</footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = (v) => v != null && v !== "" && Number.isFinite(+v);
const fmt = (v, d = 1) => (isNum(v) ? (+v).toFixed(d) : "–");
const sgn = (v, d = 1) => (isNum(v) ? (v > 0 ? "+" : "") + (+v).toFixed(d) : "–");
const objs = (o) => (o?.rows || []).map((r) => Object.fromEntries(o.cols.map((c, i) => [c, r[i]])));
const V = "__BUILD__";
const get = (u) => fetch(`data/${u}?v=${V}`).then((r) => { if (!r.ok) throw new Error(u); return r.json(); });
const full = (q) => `index.html?c=GBL&${q}`;                        // σύνδεσμος στο πλήρες σάιτ
const nice = (n) => String(n || "").split(",").map((x) => x.trim()).reverse().join(" ").toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());

let S, A, R, E, META, season;
const tname = (c) => S.teams?.[c] || c;
// σήμα ομάδας (χρώματα από teams_meta.json, αλλιώς ουδέτερο)
const meta = (c) => META?.[c] || { abbr: tname(c).replace(/[^\p{L}\d]/gu, "").slice(0, 3).toUpperCase(), c1: "var(--muted)", fg: "#fff" };
const badgeG = (c, x, y, r) => { const m = meta(c); return `<circle cx="${x}" cy="${y}" r="${r}" fill="${m.c1}"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" style="fill:${m.fg || "#fff"};font:700 ${(r * 0.72).toFixed(1)}px var(--font-display)">${esc(m.abbr)}</text>`; };
const badge = (c, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="vertical-align:middle;flex:none" aria-hidden="true">${badgeG(c, s / 2, s / 2, s / 2 - 1)}</svg>`;
const teamA = (c) => `<a href="${full("t=" + encodeURIComponent(c))}" title="Αναλυτικά στο πλήρες σάιτ">${badge(c)} ${esc(tname(c))}</a>`;

async function load() {
  const man = await get("manifest.json");
  const ci = man.competitions.find((c) => c.code === "GBL");
  season = Math.max(...ci.seasons);
  $("#upd").textContent = `${season}-${String((season + 1) % 100).padStart(2, "0")} · ενημέρωση ${man.updated}`;
  [S, A, R, E, META] = await Promise.all([get(`GBL${season}.json`), get("analytics_GBL.json"), get("roles_GBL.json").catch(() => null),
    get("edge_GBL.json").catch(() => null), get("teams_meta.json").then((m) => m.GBL).catch(() => null)]);
  standings(); nextRound(); teams(); players();
}

// ------------------------------------------------------------------ βαθμολογία
function standings() {
  const T = objs(A.seasons[season].teams), games = objs(S.games);
  const rec = {};
  for (const g of games.sort((a, b) => a.date.localeCompare(b.date))) for (const [c, my, op] of [[g.home, g.hs, g.as], [g.away, g.as, g.hs]]) {
    const r = rec[c] || (rec[c] = { gp: 0, w: 0, pf: 0, pa: 0, res: [] });
    r.gp++; r.pf += my; r.pa += op; if (my > op) r.w++; r.res.push(my > op ? "Ν" : "Η");
  }
  const rows = Object.entries(rec).map(([c, r]) => ({ c, ...r, adj: T.find((t) => t.team === c)?.adj_net }))
    .sort((a, b) => b.w / b.gp - a.w / a.gp || (b.pf - b.pa) - (a.pf - a.pa));
  $("#standings").innerHTML = `<h2>Βαθμολογία</h2>
    <div class="tbl-wrap"><table><thead><tr><th class="n">#</th><th>Ομάδα</th><th class="n">Αγ.</th><th class="n">Ν-Η</th><th class="n">Υπέρ</th><th class="n">Κατά</th><th class="n">Διαφ.</th><th>Φόρμα</th><th class="n" title="Rating: διαφορά πόντων ανά 100 κατοχές, διορθωμένη για τους αντιπάλους">Rating</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td class="n">${i + 1}</td><td>${teamA(r.c)}</td><td class="n">${r.gp}</td><td class="n"><b>${r.w}-${r.gp - r.w}</b></td>
      <td class="n">${fmt(r.pf / r.gp)}</td><td class="n">${fmt(r.pa / r.gp)}</td><td class="n">${sgn((r.pf - r.pa) / r.gp)}</td>
      <td style="font-family:var(--font-num);letter-spacing:1px">${r.res.slice(-5).map((x) => `<span style="color:var(--${x === "Ν" ? "good" : "bad"})">${x}</span>`).join("")}</td>
      <td class="n">${sgn(r.adj)}</td></tr>`).join("")}</tbody></table></div>
    <p class="sub">Υπέρ/Κατά/Διαφ.: πόντοι ανά αγώνα. Φόρμα: τελευταίοι 5 (Ν νίκη, Η ήττα). Πάτα μια ομάδα για τα αναλυτικά στο πλήρες σάιτ.</p>`;
}

// ------------------------------------------------------------------ επόμενη αγωνιστική
function nextRound() {
  const up = objs(S.upcoming);
  if (!up.length) { $("#next").innerHTML = ""; return; }
  const r0 = Math.min(...up.map((u) => u.round)), G = up.filter((u) => u.round === r0);
  const pm = new Map((E?.upcoming || []).map((u) => [u.gameCode, u]));
  $("#next").innerHTML = `<h2>Επόμενη αγωνιστική (${r0}η)</h2>
    <div class="fixt">${G.map((g) => { const m = pm.get(g.gameCode), p = m?.p_home;
      return `<div class="tile"><div class="l">${esc(g.date)} ${esc(g.time || "")}</div>
        <div>${teamA(g.home)}</div><div>${teamA(g.away)}</div>
        ${isNum(p) ? `<div style="font-size:13px"><span class="muted">Μοντέλο:</span> <b>${Math.round(100 * p)}%</b> – ${Math.round(100 * (1 - p))}% · ${esc(tname(p >= 0.5 ? g.home : g.away))} κατά ${fmt(Math.abs(m.line))}</div>` : ""}</div>`; }).join("")}</div>
    <p class="more"><a href="plan.html">Πλάνο αγωνιστικής με δελτίο →</a></p>`;
}

// ------------------------------------------------------------------ scatter
function scatter({ pts, xl, yl, xr = false, yr = false, W = 420, H = 330, fx = (v) => fmt(v), fy = (v) => fmt(v), diag = false }) {
  const L = 52, Rm = 14, T = 12, B = 40;
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const pad = (a) => { const lo = Math.min(...a), hi = Math.max(...a), d = (hi - lo) * 0.12 || 1; return [lo - d, hi + d]; };
  let [x0, x1] = pad(xs), [y0, y1] = pad(ys);
  if (diag) { const lo = Math.min(x0, y0), hi = Math.max(x1, y1); x0 = y0 = lo; x1 = y1 = hi; }
  const X = (v) => (xr ? W - Rm - ((v - x0) / (x1 - x0)) * (W - L - Rm) : L + ((v - x0) / (x1 - x0)) * (W - L - Rm));
  const Y = (v) => (yr ? T + ((v - y0) / (y1 - y0)) * (H - T - B) : H - B - ((v - y0) / (y1 - y0)) * (H - T - B));
  const ticks = (a, b) => { const st = Math.pow(10, Math.floor(Math.log10((b - a) / 4))); const s = [1, 2, 5, 10].map((k) => k * st).find((k) => (b - a) / k <= 6); const o = []; for (let v = Math.ceil(a / s) * s; v <= b; v += s) o.push(+v.toFixed(6)); return o; };
  const med = (a) => { const s = [...a].sort((p, q) => p - q); return s[Math.floor(s.length / 2)]; };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yl)} ως προς ${esc(xl)}">`;
  ticks(x0, x1).forEach((v) => (s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}"/><text x="${X(v)}" y="${H - B + 15}" text-anchor="middle" style="font-size:11px">${fx(v)}</text>`));
  ticks(y0, y1).forEach((v) => (s += `<line class="grid" x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" style="font-size:11px">${fy(v)}</text>`));
  if (diag) s += `<line class="axis" x1="${X(x0)}" y1="${Y(x0)}" x2="${X(x1)}" y2="${Y(x1)}" stroke-dasharray="4 4"/>`;
  else s += `<line class="axis" x1="${X(med(xs))}" x2="${X(med(xs))}" y1="${T}" y2="${H - B}" stroke-dasharray="4 4"/><line class="axis" x1="${L}" x2="${W - Rm}" y1="${Y(med(ys))}" y2="${Y(med(ys))}" stroke-dasharray="4 4"/>`;
  s += `<text x="${(L + W - Rm) / 2}" y="${H - 6}" text-anchor="middle" style="font-size:12px">${esc(xl)}${xr ? " (δεξιά = καλύτερα)" : ""}</text>`;
  s += `<text transform="translate(13 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" style="font-size:12px">${esc(yl)}${yr ? " (πάνω = καλύτερα)" : ""}</text>`;
  for (const p of pts) s += `<g data-team="${esc(p.c)}"><title>${esc(tname(p.c))}: ${esc(xl)} ${fx(p.x)}, ${esc(yl)} ${fy(p.y)}</title>${badgeG(p.c, X(p.x), Y(p.y), 11)}</g>`;
  return s + "</svg>";
}

function teams() {
  const T = objs(A.seasons[season].teams), F = new Map(objs(A.seasons[season].four_factors).map((f) => [f.team, f]));
  const pc = (v) => (100 * v).toFixed(0) + "%";
  const P = (fx, fy) => T.map((t) => ({ c: t.team, x: fx(t), y: fy(t) })).filter((p) => isNum(p.x) && isNum(p.y));
  const plots = [
    { t: "Επίθεση και άμυνα", d: "Πόντοι ανά 100 κατοχές, διορθωμένοι για τους αντιπάλους. Πάνω δεξιά: καλή και στα δύο.",
      pts: P((t) => t.adj_o, (t) => t.adj_d), xl: "Επίθεση", yl: "Άμυνα (πόντοι που δέχεται)", yr: true },
    { t: "Ρυθμός και δύναμη", d: "Κατοχές ανά αγώνα και συνολικό rating (διαφορά ανά 100 κατοχές).",
      pts: P((t) => t.adj_pace, (t) => t.adj_net), xl: "Ρυθμός (κατοχές)", yl: "Rating", fy: (v) => sgn(v, 0) },
    { t: "Σουτ", d: "eFG%: ευστοχία με τα τρίποντα να μετρούν 1.5 φορές. Δική της και των αντιπάλων.",
      pts: P((t) => F.get(t.team)?.o_efg, (t) => F.get(t.team)?.d_efg), xl: "eFG% ομάδας", yl: "eFG% αντιπάλων", yr: true, fx: pc, fy: pc },
    { t: "Ριμπάουντ", d: "Επιθετικά ριμπάουντ της ομάδας και των αντιπάλων (ποσοστό των διαθέσιμων).",
      pts: P((t) => F.get(t.team)?.o_orb, (t) => F.get(t.team)?.d_orb), xl: "OREB% ομάδας", yl: "OREB% αντιπάλων", yr: true, fx: pc, fy: pc },
    { t: "Νίκες και αναμενόμενες νίκες", d: "Αναμενόμενες από τη διαφορά πόντων. Πάνω από τη διαγώνιο: πιο τυχερή (κερδίζει τα κλειστά).",
      pts: P((t) => t.exp_w, (t) => t.W), xl: "Αναμενόμενες νίκες", yl: "Νίκες", diag: true, fx: (v) => fmt(v, 0), fy: (v) => fmt(v, 0) },
  ];
  $("#teams").innerHTML = `<h2>Ομάδες</h2><p class="sub">Κάθε σήμα είναι μία ομάδα· οι διακεκομμένες γραμμές είναι ο διάμεσος. Πάτα ένα σήμα για τα αναλυτικά της ομάδας.</p>
    <div class="scat-grid">${plots.map((p) => `<figure><figcaption>${p.t}<small>${p.d}</small></figcaption><div class="chart">${scatter(p)}</div></figure>`).join("")}</div>
    <p class="more"><a href="index.html#analysis">Περισσότερα: four factors, τάσεις, σύγκριση ομάδων στο πλήρες σάιτ →</a></p>`;
  $("#teams").addEventListener("click", (e) => { const g = e.target.closest("g[data-team]"); if (g) location.href = full("t=" + encodeURIComponent(g.dataset.team)); });
}

// ------------------------------------------------------------------ παίκτες
function radar(axes, series, W = 480, H = 380) {
  const cx = W / 2, cy = H / 2 + 4, Rr = Math.min(W, H) / 2 - 70, n = axes.length;
  const pt = (i, r) => [cx + r * Math.sin((2 * Math.PI * i) / n), cy - r * Math.cos((2 * Math.PI * i) / n)];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="radar">`;
  [0.25, 0.5, 0.75, 1].forEach((f) => (s += `<polygon class="grid" fill="none" points="${axes.map((_, i) => pt(i, Rr * f).join(",")).join(" ")}"/>`));
  axes.forEach((a, i) => { const [x, y] = pt(i, Rr), [lx, ly] = pt(i, Rr + 20);
    s += `<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/><text x="${lx}" y="${ly + 4}" style="font-size:12px" text-anchor="${Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end"}">${esc(a)}</text>`; });
  s += `<polygon fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 3" points="${axes.map((_, i) => pt(i, Rr * 0.5).join(",")).join(" ")}"/>`;
  for (const se of series) { const p = se.vals.map((v, i) => pt(i, Rr * Math.max(0.03, isNum(v) ? v : 0)).join(",")).join(" ");
    s += se.dash ? `<polygon class="line ${se.k}" points="${p}" style="stroke-dasharray:5 4;stroke-width:1.5"/>` : `<polygon class="area ${se.k}" points="${p}"/><polygon class="line ${se.k}" points="${p}"/>`; }
  return s + "</svg>";
}

function players() {
  const PL = objs(S.logs), An = new Map(objs(A.seasons[season].players).map((p) => [p.pid, p]));
  const agg = {};
  for (const l of PL) { const a = agg[l.pid] || (agg[l.pid] = { pid: l.pid, team: l.team, gp: 0, min: 0, pts: 0, reb: 0, ast: 0, pir: 0, fg3m: 0 });
    if (!(l.MIN > 0)) continue; a.team = l.team; a.gp++; a.min += l.MIN; a.pts += l.PTS; a.reb += l.REB; a.ast += l.AST; a.pir += l.PIR; a.fg3m += l.FG3M; }
  const rows = Object.values(agg).filter((a) => a.gp > 0).map((a) => ({ ...a, name: S.players?.[a.pid] || a.pid, ovr: An.get(a.pid)?.ovr }));
  const RO = new Map(), Rs = R?.players?.[String(season)] || [];
  for (const r of Rs) { const o = Object.fromEntries(R.cols.map((c, i) => [c, r[i]])); RO.set(o.pid, o); }
  const ui = { team: "", q: "", all: false, sel: null };
  const MIN_GP = Math.max(2, Math.ceil(0.5 * Math.max(...rows.map((r) => r.gp))));
  const teamsL = [...new Set(rows.map((r) => r.team))].sort((a, b) => tname(a).localeCompare(tname(b)));
  $("#players").innerHTML = `<h2>Παίκτες</h2>
    <div class="filters"><label>Ομάδα<select id="pt"><option value="">Όλες</option>${teamsL.map((c) => `<option value="${esc(c)}">${esc(tname(c))}</option>`).join("")}</select></label>
      <label>Αναζήτηση<input id="pq" placeholder="όνομα"></label></div>
    <div id="pcard"></div><div id="ptab"></div>`;
  const draw = () => {
    let L = rows.filter((r) => (!ui.team || r.team === ui.team) && (!ui.q || r.name.toLowerCase().includes(ui.q)));
    L.sort((a, b) => (b.gp >= MIN_GP) - (a.gp >= MIN_GP) || b.pir / b.gp - a.pir / a.gp);      // πρώτα όσοι έχουν αρκετούς αγώνες
    const shown = ui.all || ui.team || ui.q ? L : L.slice(0, 20);
    $("#ptab").innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Παίκτης</th><th>Ομάδα</th><th class="n">Αγ.</th><th class="n">Λεπτά</th><th class="n">Πόντοι</th><th class="n">Ριμπ.</th><th class="n">Ασίστ</th><th class="n">PIR</th><th class="n" title="Συνολική βαθμολογία (40–99)">OVR</th></tr></thead><tbody>
      ${shown.map((r) => `<tr class="pl-row ${ui.sel === r.pid ? "on" : ""}" data-pid="${esc(r.pid)}"><td><b>${esc(nice(r.name))}</b></td><td>${badge(r.team, 18)} ${esc(tname(r.team))}</td><td class="n">${r.gp}</td><td class="n">${fmt(r.min / r.gp)}</td>
        <td class="n">${fmt(r.pts / r.gp)}</td><td class="n">${fmt(r.reb / r.gp)}</td><td class="n">${fmt(r.ast / r.gp)}</td><td class="n"><b>${fmt(r.pir / r.gp)}</b></td><td class="n">${r.ovr ?? "–"}</td></tr>`).join("")}</tbody></table></div>
      <p class="sub">Μέσοι όροι ανά αγώνα, ταξινόμηση με PIR (πρώτα όσοι έχουν ≥ ${MIN_GP} αγώνες). Πάτα έναν παίκτη για την κάρτα του.${!ui.all && !ui.team && !ui.q && L.length > 20 ? ` <button class="chip" id="pall">Όλοι οι παίκτες (${L.length})</button>` : ""}</p>`;
    $("#pall")?.addEventListener("click", () => { ui.all = true; draw(); });
    $("#ptab").querySelectorAll("tr[data-pid]").forEach((tr) => tr.addEventListener("click", () => { ui.sel = tr.dataset.pid; card(); draw(); $("#pcard").scrollIntoView({ behavior: "smooth", block: "start" }); }));
  };
  const card = () => {
    const r = rows.find((x) => x.pid === ui.sel); if (!r) { $("#pcard").innerHTML = ""; return; }
    const b = S.bio?.[r.pid] ? Object.fromEntries(S.bio_cols.map((c, i) => [c, S.bio[r.pid][i]])) : {};
    const age = b.birth ? Math.floor((Date.now() - Date.parse(b.birth)) / 3.15576e10) : null;
    const o = RO.get(r.pid), an = An.get(r.pid);
    const top = o ? o.probs.map((q, k) => [k, q]).sort((a, c) => c[1] - a[1])[0] : null;
    const tags = o && R.tags ? R.tags.map((t, i) => [t, o.pct[i]]).filter(([, v]) => v >= (R.tag_min ?? 0.8)).map(([t]) => t) : [];
    const facts = [["Ομάδα", teamA(r.team)], ["Θέση", b.pos], ["Ηλικία", age], ["Ύψος", b.height ? b.height + " cm" : null], ["Βάρος", b.weight ? b.weight + " kg" : null],
      ["OVR", an?.ovr != null ? `<b>${an.ovr}</b>${isNum(an.pc_ovr) ? ` <span class="muted">(${an.pc_ovr >= 50 ? "top " + Math.max(1, 100 - an.pc_ovr) + "%" : "κάτω " + an.pc_ovr + "%"})</span>` : ""}` : null]]
      .filter(([, v]) => v != null && v !== "");
    $("#pcard").innerHTML = `<div class="tile pcard">
      <div><div style="font:700 20px var(--font-display)">${esc(nice(r.name))}</div>
        <dl class="pfacts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${k === "Ομάδα" || k === "OVR" ? v : esc(v)}</dd>`).join("")}</dl>
        <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px">${[["Πόντοι", r.pts], ["Ριμπ.", r.reb], ["Ασίστ", r.ast], ["Τρίπ.", r.fg3m], ["PIR", r.pir]].map(([l, v]) => `<div class="tile" style="padding:6px 8px"><div class="v" style="font-size:16px">${fmt(v / r.gp)}</div><div class="l">${l}</div></div>`).join("")}</div>
        ${top ? `<div style="margin-top:10px"><span class="muted">Ρόλος:</span> <b>${esc(R.roles[top[0]].name)}</b> <span class="muted">${Math.round(100 * top[1])}%</span></div>
          <div class="muted" style="font-size:12px">${esc(R.roles[top[0]].desc || "")}</div>
          ${tags.length ? `<div class="chips" style="margin-top:6px">${tags.map((t) => `<span class="pill" style="background:var(--accent-soft)">${esc(t)}</span>`).join("")}</div>` : ""}` : ""}
        <p class="more" style="margin-top:10px"><a href="${full("p=" + encodeURIComponent(r.pid))}">Πλήρης κάρτα: ratings, καριέρα, σύγκριση →</a></p></div>
      <div>${o ? `<div class="chart">${radar(R.axes_short || R.axes, [{ k: "k1", vals: o.pct }, ...(top && R.roles[top[0]].center_pct ? [{ k: "k3", dash: true, vals: R.roles[top[0]].center_pct }] : [])])}</div>
        <div class="muted" style="font-size:12px">Ποσοστημόριο σε κάθε άξονα (διακεκομμένος κύκλος = διάμεσος)· η διακεκομμένη γραμμή είναι ο τυπικός παίκτης του ρόλου. Η GBL δεν έχει ζώνες σουτ: όπου λείπουν, μετρούν οι σεζόν του σε άλλες λίγκες.</div>`
        : `<div class="empty">Δεν υπάρχει radar (λίγα λεπτά χωρίς ιστορία).</div>`}</div></div>`;
  };
  $("#pt").addEventListener("change", (e) => { ui.team = e.target.value; draw(); });
  $("#pq").addEventListener("input", (e) => { ui.q = e.target.value.trim().toLowerCase(); draw(); });
  ui.sel = rows.filter((r) => r.gp >= MIN_GP).sort((a, b) => b.pir / b.gp - a.pir / a.gp)[0]?.pid;     // αρχικά: ο πρώτος σε PIR
  card(); draw();
}

load().catch((e) => { $("#standings").innerHTML = `<div class="empty">Σφάλμα φόρτωσης: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
