name: Update data, train model, deploy site

on:
  schedule:
    - cron: "17 4 * * *"          # κάθε μέρα ~06:17-07:17 ώρα Ελλάδας
  workflow_dispatch:              # χειροκίνητο run από το tab "Actions"
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write                 # για να κάνει commit τα νέα δεδομένα / μοντέλο
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150          # το ΠΡΩΤΟ run κατεβάζει 4 σεζόν x 2 διοργανώσεις
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch new games (incremental)
        run: python scripts/fetch_data.py

      - name: Train player-form model (Keras)
        run: python scripts/train_model.py

      - name: Build site database
        run: python scripts/build_site.py

      - name: Commit data and model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw models
          git diff --cached --quiet || git commit -m "Data update $(date -u +'%Y-%m-%d')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
