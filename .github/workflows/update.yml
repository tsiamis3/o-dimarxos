name: Update data, models, deploy site

on:
  schedule:
    - cron: "17 4 * * *"          # κάθε μέρα ~06:17-07:17 ώρα Ελλάδας
  workflow_dispatch:              # χειροκίνητο run από το tab "Actions"
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write                 # για να κάνει commit τα νέα δεδομένα / μοντέλο
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150          # το ΠΡΩΤΟ run κατεβάζει 4 σεζόν x 2 διοργανώσεις
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt requests

      - name: Fetch new games (incremental)
        run: python scripts/fetch_data.py

      # Τα υπόλοιπα πρωταθλήματα: αν κάποιο site δεν απαντήσει, το site ανεβαίνει κανονικά με τα υπόλοιπα
      - name: Greek Basket League (esake.gr)
        continue-on-error: true
        run: python scripts/scrapers/esake.py

      - name: NBA (ESPN)
        continue-on-error: true
        run: python scripts/scrapers/nba_espn.py

      # Σουτ με συντεταγμένες για τα shot charts (μόνο τα νέα ματς)
      - name: Shot data (EuroLeague/EuroCup API, NBA via ESPN)
        continue-on-error: true
        run: python scripts/scrapers/shots.py

      # Play-by-play EuroLeague/EuroCup για το RAPM (μόνο τα νέα ματς)
      - name: Play-by-play (EuroLeague/EuroCup API)
        continue-on-error: true
        run: python scripts/scrapers/pbp.py

      # Βιομετρικά παικτών EuroLeague/EuroCup (ύψος, βάρος, ηλικία, θέση) για το GNN
      - name: Player bio (EuroLeague/EuroCup API)
        continue-on-error: true
        run: python scripts/scrapers/bio.py

      - name: Player bio (NBA, ESPN)
        continue-on-error: true
        run: python scripts/scrapers/bio_nba.py

      - name: NBA odds and injuries (ESPN)
        continue-on-error: true
        run: |
          python scripts/scrapers/odds_espn.py
          python scripts/scrapers/injuries_espn.py

      # Αποδόσεις EuroLeague/EuroCup κ.ά.: μόνο αν υπάρχει το secret ODDS_API_KEY (αλλιώς δεν κάνει τίποτα)
      - name: Odds (The Odds API, optional)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/scrapers/odds_api.py

      - name: Α2 γυναικών (apps.basket.gr)
        continue-on-error: true
        run: python scripts/scrapers/eok_apps.py --comp 5 --code WBL2

      - name: Analytics (adjusted ratings, four factors, players)
        run: python scripts/analytics.py

      - name: GNN dataset (graphs per game, EuroLeague + EuroCup)
        continue-on-error: true
        run: python scripts/gnn_data.py

      - name: Betting model (edge vs market)
        run: python scripts/edge_model.py

      - name: Build site database
        run: python scripts/build_site.py

      - name: Commit data and model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/predictions
          git diff --cached --quiet || git commit -m "Data update $(date -u +'%Y-%m-%d')"
          git pull --rebase -X theirs origin main   # αν άλλαξε κώδικας στο μεταξύ, μην αποτύχει το push
          git push

      - name: Cache busting (κάθε deploy φορτώνει αμέσως τα νέα αρχεία)
        run: sed -i "s/__BUILD__/${GITHUB_RUN_ID}/g" site/index.html site/notes.html site/gnn.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
