# ΠΡΟΣΩΡΙΝΟ: κατέβασμα/έλεγχος σουτ με συντεταγμένες από τους servers του GitHub
# (το περιβάλλον ανάπτυξης δεν έχει πρόσβαση). Θα αφαιρεθεί πριν το merge στο main.
name: Shots probe (temporary)

on:
  push:
    branches: [ccr-664a1cd1-51s247]
    paths: ["scripts/scrapers/shots.py", ".github/workflows/shots-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shots-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests euroleague-api xmltodict
      - name: Probe (raw samples + coordinate check)
        run: python scripts/scrapers/shots.py --comp E --probe 1
      - name: Download all shots (E, U, NBA)
        run: python scripts/scrapers/shots.py
      - name: Commit shots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/*_shots.csv.gz
          git diff --cached --quiet || git commit -m "Shot data with coordinates (probe)"
          git pull --rebase origin ccr-664a1cd1-51s247
          git push origin HEAD:ccr-664a1cd1-51s247
