# ΠΡΟΣΩΡΙΝΟ: κατέβασμα play-by-play EuroLeague/EuroCup από τους servers του GitHub
# (το περιβάλλον ανάπτυξης δεν έχει πρόσβαση). Θα αφαιρεθεί πριν το merge στο main.
name: PBP probe (temporary)

on:
  push:
    branches: [ccr-664a1cd1-51s247]
    paths: ["scripts/scrapers/pbp.py", ".github/workflows/pbp-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pbp-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests euroleague-api xmltodict
      - name: Probe
        run: python scripts/scrapers/pbp.py --comp E --probe 1
      - name: Download play-by-play (E, U)
        run: python scripts/scrapers/pbp.py
      - name: Commit to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/*_pbp.csv.gz
          git diff --cached --quiet || git commit -m "Play-by-play EuroLeague/EuroCup (probe)"
          git pull --rebase origin ccr-664a1cd1-51s247
          git push origin HEAD:ccr-664a1cd1-51s247
