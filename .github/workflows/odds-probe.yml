# ΠΡΟΣΩΡΙΝΟ: επαλήθευση του scraper αποδόσεων ESPN από τους servers του GitHub
# (το περιβάλλον ανάπτυξης δεν έχει πρόσβαση στο ESPN). Θα αφαιρεθεί πριν το merge στο main.
name: Odds probe (temporary)

on:
  push:
    branches: [ccr-664a1cd1-51s247]
    paths: ["scripts/scrapers/odds_espn.py", "scripts/scrapers/injuries_espn.py", ".github/workflows/odds-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: Probe raw pickcenter
        run: python scripts/scrapers/odds_espn.py --season 2026 --probe 2
      - name: Download odds (2025 + 2026)
        run: python scripts/scrapers/odds_espn.py
      - name: Injuries (probe)
        run: python scripts/scrapers/injuries_espn.py --probe
      - name: Commit odds to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/NBA*_odds.csv data/raw/NBA_injuries.csv
          git diff --cached --quiet || git commit -m "NBA odds from ESPN (probe)"
          git pull --rebase origin ccr-664a1cd1-51s247
          git push origin HEAD:ccr-664a1cd1-51s247
