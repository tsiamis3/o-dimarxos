<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ε.Ο.Κ. Βαθμολογίες</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://apps.basket.gr/css/bootstrap.min.css">

    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap');

        .sticky-col {
            position: -webkit-sticky;
            position: sticky;
            background-color: white;
        }

        .first-col {
            min-width: 50px;
            max-width: 50px;
            left: 0px;
        }

        .second-col {
            left: 50px;
        }

        :root {
            --basket-orange: #f48120;
            --basket-blue: #004895;
        }

        * {
            margin: 0;
            font-family: 'Roboto Condensed', sans-serif;
            box-sizing: border-box;
        }

        td, th {
            border: 1px solid lightgrey;
            padding: 0 15px;
            text-align: center;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .title {
            text-align: center;
            color: var(--basket-orange);
            margin-bottom: 20px;
        }

        .title-date {
            color: var(--basket-blue);
        }

        .title-group-select {
            text-align: center;
        }

        .table-wrap, .sub-table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        .explanation {
            width: 600px;
            padding: 15px 0 15px 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .main-table, .sub-table {
            border-collapse: collapse;
            background: #FDFDFD;
        }

        .main-table-head {
            background: var(--basket-blue);
            color: white;
            font-size: 16px;
            font-weight: 400;
            height: 60px;
        }

        .main-table td, .sub-table td {
            padding: 10px;
        }

        .main-table caption {
            padding: 10px 0 10px 0;
        }

        .sub-table caption {
            font-size: 1.5em;
            color: var(--basket-orange);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .round-logo-sm {
            height: 30px !important;
            width: 30px !important;
            border-radius: 50% !important;
        }

        .match-card {
            display: flex;
            background-color: #F8F8F8FF !important;
            border-radius: 20px;
            padding: 5px;
            margin: 5px;
        }

        .match-card-info-column {
            width: 25%;
            border-style: solid;
            border-color: #F8F8F8FF;
            border-width: 1px;
            border-right-color: #f48120;
        }

        .match-card-info-row {
            width: 100%;
            font-size: 10px;
            padding: 2px;
        }

        .match-card-score-column {
            padding: 3px;
            width: 75%;
        }

        .match-card-score-row {
            padding: 5px;
            display: flex;
            width: 100%;
        }

        .match-card-score-first-column {
            width: 80%;
        }

        .mt-3 {
            margin-top: 3px;
        }

        .match-card-score-second-column {
            width: 20%;
        }

        .group-header-tab:hover {
            background-color: #fbc69a;
        }

        .center {
            margin: auto;
            width: 60%;
        }

        /* Extra Small Devices, Phones */
        @media only screen and (min-width: 480px) {
            .group-div {
                flex-direction: column;
                display: flex;
                justify-content: space-between;
            }

            .apotelesmata {
                order: 0;
                margin: 20px 0 20px 0;
                padding: 15px 50px 15px 0;
                width: 100%;
            }

            .matches {
                margin: 20px 0 20px 0;
                padding: 15px 50px 15px 0;
                order: 1;
                width: 100%;
            }
        }

        /* Medium Devices, Desktops */
        @media only screen and (min-width: 768px) {
            .group-div {
                flex-direction: row;
                display: flex;
                justify-content: space-between;
            }

            .apotelesmata {
                order: 0;
                margin: 20px 0 20px 0;
                padding: 15px 50px 15px 0;
                width: 50%;
            }

            .matches {
                margin: 20px 0 20px 0;
                padding: 15px 50px 15px 0;
                order: 1;
                width: 50%;
            }
        }

        /* Large Devices, Wide Screens */
        @media only screen and (min-width: 1200px) {
            .group-div {
                flex-direction: row;
                display: flex;
                justify-content: space-between;
            }

            .apotelesmata {
                order: 0;
                margin: 20px 0 20px 0;
                padding: 15px 50px 15px 0;
                width: 50%;
            }

            .matches {
                margin: 20px 0 20px 0;
                padding: 15px 50px 15px 0;
                order: 1;
                width: 50%;
                justify-content: center;
            }
        }

        @media only screen and (max-width: 850px) {
            #group-header-tabs {
                display: none;
            }
        }

        @media only screen and (min-width: 851px) {
            #select-group-dropdown {
                display: none;
            }

            .group-header-tab {
                border-radius: 25px;
                background-color: #e8e8e8;
                padding: 10px;
                margin-left: 10px;
                cursor: pointer;
                width: 120px;
                text-overflow: ellipsis;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
            }

            .group-header-tab-active {
                background-color: #fbc69a;
            }
        }

        @media only screen and (min-width: 1000px) {
            .group-header-tab {
                border-radius: 25px;
                background-color: #e8e8e8;
                padding: 10px;
                margin-left: 10px;
                cursor: pointer;
                width: 180px;
                text-overflow: ellipsis;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
            }

            .group-header-tab-active {
                background-color: #fbc69a;
            }
        }

        /* pulsing line skeleton of the lazy loaded group tabs */
        .skeleton-line {
            height: 14px;
            margin-bottom: 18px;
            border-radius: 7px;
            background-color: #e4e4e4;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
        }

        .skeleton-line-title {
            width: 35%;
            height: 24px;
            margin-bottom: 28px;
        }

        @keyframes skeleton-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton-line { animation: none; }
        }

    </style>
</head>
<body>
<div class="container-fluid">
    <h1 class="title">
        <div class="title-group-select col-sm-12 col-md-6 offset-md-3">
            <a class="btn btn-sm btn-outline-primary" data-toggle="modal" data-target="#selectGroupModal"
               style="color: #0b0b8a">
                Επιλέξτε πρωτάθλημα
            </a>
            <div class="modal fade" id="selectGroupModal" role="dialog">
    <div class="modal-dialog <!--modal-lg-->">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    Επιλέξτε πρωτάθλημα
                </h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body text-center">
                            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-default" data-dismiss="modal">
                    Κλείσιμο                </button>
            </div>
        </div>
    </div>
</div>
        </div>
    </h1>

    </div>

<script src="https://apps.basket.gr/js/jquery-3.4.1.min.js"></script>

<script src="https://apps.basket.gr/js/jquery-ui.min.js"></script>
<script src="https://apps.basket.gr/js/bootstrap.min.js"></script>

<script>
    $('.group-header-tab').click(function () {
        var group_id = $(this).data('group-id');

        $('#competition_season_stage_group_id').val(group_id);

        showGroup(group_id);
    });

    function showGroup(group_id) {
        makeHeadersInactive();
        hideAllTabs();

        $('#group-header-tab-' + group_id).addClass('group-header-tab-active');

        var $tab = $('#group-content-tab-' + group_id);
        $tab.show();

        loadGroup(group_id);
    }

    function loadGroup(group_id) {
        var $tab = $('#group-content-tab-' + group_id);

        if ($tab.data('loaded') == 1) {
            return;
        }

        $tab.data('loaded', 1);
        $tab.html(skeletonHtml);

        $.ajax({
            url: '/iframe/groups/' + group_id + '/standings',
            type: 'get',
            dataType: 'json',
            success: function (response) {
                $tab.html(response.html);
            },
            error: function (response) {
                // allow retrying on the next tab open
                $tab.data('loaded', 0);
                $tab.html('<div class="text-center mt-5">Σφάλμα φόρτωσης. Πατήστε ξανά την καρτέλα του ομίλου.</div>');
            }
        });
    }

    // kept to show again when a failed group is retried
    var skeletonHtml = $('.group-skeleton').first().prop('outerHTML');

    // the initially visible group is loaded right away, the rest when their tab is opened
    var $initialTab = $('.group-content-tab').first();
    if ($initialTab.length) {
        loadGroup($initialTab.data('group-id'));
    }

    function makeHeadersInactive() {

        $('.group-header-tab').each(function (i, obj) {
            $(this).removeClass('group-header-tab-active');
        });
    }

    function hideAllTabs() {
        $('.group-content-tab').each(function (i, obj) {
            $(this).hide();
        });
    }

    // delegated, since the lazy loaded groups add their own matchweek selects
    $(document).on('change', '.matchweek-id', function () {
        var $this = $(this);

        var matchweek_id = $this.val();
        var group_id = $this.data('group-id');
        $('#selected-matchweek-' + group_id).toggle('show');

        $.ajax({
            url: '/iframe/matchweeks/' + matchweek_id + '/matches',
            type: 'get',
            dataType: 'json',
            success: function (response) {
                $('#selected-matchweek-' + group_id).toggle('show');
                $('#selected-matchweek-' + group_id).html(response.html);
            },
            error: function (response) {
            }
        });
    });

    $('#competition_season_stage_id').change(function () {
        var stage_id = $(this).val();

        window.location = '/iframe/seasons/' + '13' + '/standings?competition_id=' + '' + '&competition_season_stage_id=' + stage_id;
    });

    $('#competition_season_stage_group_id').change(function () {
        showGroup($(this).val());
    });
</script>
</body>
</html>
